[package]
name = "osrm"
version = "0.0.2"
description = "Bindings for Open Source Routing Machine (OSRM)."
license = "MIT"
authors = ["Michael Killough <michael.killough@deliveroo.co.uk>"]
edition = "2018"

[dependencies]
osrmc-sys = { path = "osrmc-sys", version = "0.0.2" }

[features]
# Raw table/route results, OSRM options and snap cache counters (`src/raw.rs`).
raw-results = ["osrmc-sys/raw-results"]
